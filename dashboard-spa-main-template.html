    <nav class="app-sidebar-nav">

  <!-- Filter Slide-Out Drawer -->
  <div id="filter-overlay" class="app-filter-overlay hidden" hx-on:click="window.AppUI && window.AppUI.closeFilterDrawer()"></div>

  <div id="filter-drawer" class="app-filter-drawer">
    <!-- Drawer Header -->
    <div class="app-filter-drawer-header">
      <h3 class="app-filter-drawer-title">Filters</h3>
      <button id="close-filter-drawer" class="app-filter-close-btn" hx-on:click="window.AppUI && window.AppUI.closeFilterDrawer()">
        <span class="material-icons">close</span>
      </button>
    </div>

    <!-- Drawer Content — add your filter controls here -->
    <div class="app-filter-drawer-content" style="height: calc(100% - 65px);">

      <!-- Example: Organization Filter -->
      <div class="app-filter-group">
        <label class="app-filter-label">Organization</label>
        <div id="filter-org-container">
          <!-- Populate with RewstDOM.createAutocomplete() or createStyledDropdown() -->
        </div>
      </div>

      <!-- Example: Date Range Filter -->
      <div class="app-filter-group">
        <label class="app-filter-label">Date Range</label>
        <div id="filter-date-container">
          <!-- Populate with RewstDOM.createStyledDropdown() -->
        </div>
      </div>

      <!-- Example: Custom Filter -->
      <div class="app-filter-group">
        <label class="app-filter-label">Custom Filter</label>
        <div id="filter-custom-container">
          <!-- Populate with RewstDOM.createMultiSelect() -->
        </div>
      </div>

    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content" class="main-content app-main-content">

    <!-- Sticky Header -->
    <div id="sticky-header" class="sticky-header app-sticky-header">
      <div class="app-sticky-header-row">
        <div>
          <h1 class="app-page-title">Prerequisites</h1>
          <p class="header-subtitle app-page-subtitle">Company and user-level validation checks</p>
        </div>
        <div class="app-header-actions">

          <!-- Dark Mode Toggle -->
          <label id="toggle-example" class="dark-mode-toggle app-dark-toggle">
            <span class="app-dark-toggle-label">Dark mode</span>
            <span id="dark-mode-sun" class="material-icons app-dark-toggle-sun">light_mode</span>
            <div class="app-dark-toggle-switch">
              <input type="checkbox" id="header-toggle" class="app-visually-hidden" hx-on:change="window.AppUI && window.AppUI.toggleDarkMode()">

              <div class="toggle-dot app-dark-toggle-dot"></div>

            <button id="refresh-btn" class="btn-primary app-refresh-btn" hx-on:click="window.AppUI && window.AppUI.refreshPrerequisites()">

        <!-- Rendered by vpnsetup.js -->
      </div>

        <!-- Rendered by remediation.js -->
      </div>

  <script type="module">
    // ============================================
    // REWST APP TEMPLATE - Main Script
    // ============================================

    // Import RewstApp GraphQL library
    {{ GRAPHQL_LIB }}

    // Import RewstDOM builder
    {{ DOM_BUILDER }}

    // Import workflow IDs (local override)
    {{ WORKFLOW_IDS }}

    // App initialization
    (async function() {

      // ============================================
      // DEBUG MODE
      // ============================================
      window.DEBUG_MODE = true;
      if (window.parent) {
        window.parent.DEBUG_MODE = true;
      }

      function debugLog(...args) {
        if (window.DEBUG_MODE) console.log(...args);
      }
      function debugWarn(...args) {
        if (window.DEBUG_MODE) console.warn(...args);
      }
      function debugError(...args) {
        if (window.DEBUG_MODE) console.error(...args);
      }

      // ============================================
      // INITIALIZE REWST
      // ============================================
      const rewst = new RewstApp({ debug: window.DEBUG_MODE });

      try {
        await rewst.init();
        debugLog("RewstApp initialized");
      } catch (error) {
        debugError("Failed to initialize RewstApp:", error);
        if (error.isSessionExpired) {
          RewstDOM.showSessionExpired(error.loginUrl);
          return;
        }
        RewstDOM.showError("Failed to initialize app");
        return;
      }

      // Make globally accessible (for console debugging and page scripts)
      window.rewst = rewst;
      window.rewstApp = rewst;
      window.RewstDOM = RewstDOM;

      if (window.parent) {
        window.parent.rewst = rewst;
        window.parent.rewstApp = rewst;
        window.parent.RewstDOM = RewstDOM;
        debugLog("Exposed rewst and RewstDOM to parent console");
      }

      // ============================================
      // PAGE CONFIGURATION
      // ============================================
      const APP_CONFIG = {
        autoProceedCountdownSeconds: 3
      };
      window.APP_CONFIG = APP_CONFIG;

      const pages = {
        prerequisites: {
          title: 'Prerequisites',
          subtitle: 'Company and user-level validation checks',
          render: renderPrerequisitesPage
        },
        remediation: {
          title: 'Remediation',
          subtitle: 'Guided repair workflow for blocked prerequisite checks',
          render: renderRemediationPage
        },
        vpnsetup: {
          title: 'VPN Setup',
          subtitle: 'VPN configuration and setup',
          render: renderVpnSetupPage
        }
      };

      let currentPage = 'prerequisites';

      // ============================================
      // SIDEBAR TOGGLE
      // ============================================
      const sidebar = document.getElementById('sidebar');
      const mainContent = document.getElementById('main-content');
      const toggleBtn = document.getElementById('toggle-sidebar');
      const toggleIcon = toggleBtn.querySelector('.material-icons');

      function toggleSidebar() {
        sidebar.classList.toggle('collapsed');
        mainContent.classList.toggle('sidebar-collapsed');
        toggleIcon.textContent = sidebar.classList.contains('collapsed') ? 'chevron_right' : 'chevron_left';
      }

      // Collapse the sidebar by default on small screens (< 768px).
      if (window.innerWidth < 768) {
        sidebar.classList.add('collapsed');
        mainContent.classList.add('sidebar-collapsed');
        toggleIcon.textContent = 'chevron_right';
      }

      // ============================================
      // PAGE NAVIGATION
      // ============================================
      const navLinks = document.querySelectorAll('.sidebar-item');
      const pageContainers = document.querySelectorAll('.page-content');
      const prereqCompleteIndicator = document.getElementById('prereq-complete-indicator');
      const vpnSetupNavLink = document.querySelector('.sidebar-item[data-page="vpnsetup"]');
      const vpnSetupNavText = document.getElementById('vpnsetup-nav-text');
      const AUTO_NAVIGATED_TO_VPN_KEY = 'autoNavigatedToVpnSetupV1';

      function arePrerequisitesCompleteFromCache() {
        try {
          const raw = sessionStorage.getItem('prerequisitesChecksCacheV1');
          if (!raw) return false;
          const cache = JSON.parse(raw);
          const states = cache?.checkStates;
          if (!states) return false;

          const requiredKeys = [
            'ca_name',
            'ad_domain',
            'email_verification',
            'cwm_config',
            'computer_online',
            'valid_machine_cert_installed'
          ];

          return requiredKeys.every(key => states[key] === true);
        } catch (error) {
          debugWarn('Failed to parse prerequisites cache for nav state:', error);
          return false;
        }
      }

      function setVpnSetupNavEnabled(enabled) {
        if (!vpnSetupNavLink) return;

        vpnSetupNavLink.setAttribute('aria-disabled', enabled ? 'false' : 'true');
        vpnSetupNavLink.title = enabled
          ? 'VPN Setup'
          : 'Complete all prerequisites to unlock VPN Setup';
        if (vpnSetupNavText) {
          vpnSetupNavText.textContent = enabled ? 'Manage VPN' : 'VPN Setup';
        }
        if (prereqCompleteIndicator) {
          prereqCompleteIndicator.classList.toggle('hidden', !enabled);
        }
        vpnSetupNavLink.classList.toggle('app-nav-item-disabled', !enabled);
      }

      function maybeAutoNavigateToVpnSetup(options = {}) {
        const prerequisitesComplete = arePrerequisitesCompleteFromCache();
        if (!prerequisitesComplete || currentPage !== 'prerequisites') {
          return;
        }

        try {
          if (!options.ignoreSessionGuard && sessionStorage.getItem(AUTO_NAVIGATED_TO_VPN_KEY) === 'true') {
            return;
          }
          sessionStorage.setItem(AUTO_NAVIGATED_TO_VPN_KEY, 'true');
        } catch (error) {
          debugWarn('Failed to persist auto-navigation state:', error);
        }

        switchPage('vpnsetup');
      }

      window.setVpnSetupNavEnabled = setVpnSetupNavEnabled;
      window.maybeAutoNavigateToVpnSetup = maybeAutoNavigateToVpnSetup;

      const prerequisitesCompleteOnLoad = arePrerequisitesCompleteFromCache();
      setVpnSetupNavEnabled(prerequisitesCompleteOnLoad);
      if (prerequisitesCompleteOnLoad) {
        // On startup, always default completed users to VPN setup.
        maybeAutoNavigateToVpnSetup({ ignoreSessionGuard: true });
      }

      navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const pageName = link.dataset.page;

          if (pageName === 'vpnsetup' && !arePrerequisitesCompleteFromCache()) {
            RewstDOM.showWarning('Complete all prerequisite checks before opening VPN Setup.');
            return;
          }

          switchPage(pageName);
        });
      });

      function switchPage(pageName) {
        if (!pages[pageName]) return;

        if (pageName === 'vpnsetup' && !arePrerequisitesCompleteFromCache()) {
          setVpnSetupNavEnabled(false);
          RewstDOM.showWarning('Complete all prerequisite checks before opening VPN Setup.');
          return;
        }

        currentPage = pageName;

        // Update active state in sidebar
        navLinks.forEach(l => l.classList.remove('active'));
        const activeLink = document.querySelector(`[data-page="${pageName}"]`);
        if (activeLink) {
          activeLink.classList.add('active');
        }

        // Hide all pages, show selected
        pageContainers.forEach(page => page.style.display = 'none');
        document.getElementById(`page-${pageName}`).style.display = 'block';

        // Update header
        const pageConfig = pages[pageName];
        document.querySelector('#sticky-header h1').textContent = pageConfig.title;
        document.querySelector('#sticky-header .header-subtitle').textContent = pageConfig.subtitle;

        // Render page content
        pageConfig.render();
      }

      // ============================================
      // STICKY HEADER SCROLL BEHAVIOR
      // ============================================
      const stickyHeader = document.getElementById('sticky-header');
      let lastScrollTop = 0;
      let isHeaderHidden = false;
      let isScrolledState = false;
      let scrollAccumulator = 0;
      let scrollTimeout = null;

      const SCROLL_THRESHOLD = 50;
      const SCROLL_HYSTERESIS = 30;
      const HIDE_THRESHOLD = 150;
      const SCROLL_ACCUMULATOR_THRESHOLD = 100;
      const SCROLL_RESET_DELAY = 200;

      window.addEventListener('scroll', () => {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const scrollDelta = scrollTop - lastScrollTop;

        if ((scrollAccumulator > 0 && scrollDelta < 0) || (scrollAccumulator < 0 && scrollDelta > 0)) {
          scrollAccumulator = 0;
        }
        scrollAccumulator += scrollDelta;

        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => { scrollAccumulator = 0; }, SCROLL_RESET_DELAY);

        if (!isScrolledState && scrollTop > SCROLL_THRESHOLD) {
          isScrolledState = true;
          stickyHeader.classList.add('scrolled');
        } else if (isScrolledState && scrollTop < (SCROLL_THRESHOLD - SCROLL_HYSTERESIS)) {
          isScrolledState = false;
          stickyHeader.classList.remove('scrolled');
        }

        if (scrollTop > HIDE_THRESHOLD) {
          if (scrollAccumulator > SCROLL_ACCUMULATOR_THRESHOLD && !isHeaderHidden) {
            isHeaderHidden = true;
            stickyHeader.classList.remove('show-instant');
            stickyHeader.classList.add('hide-smooth');
            scrollAccumulator = 0;
          } else if (scrollAccumulator < -SCROLL_ACCUMULATOR_THRESHOLD && isHeaderHidden) {
            isHeaderHidden = false;
            stickyHeader.classList.remove('hide-smooth');
            stickyHeader.classList.add('show-instant');
            scrollAccumulator = 0;
          }
        } else if (scrollTop < (HIDE_THRESHOLD - SCROLL_HYSTERESIS)) {
          if (isHeaderHidden) {
            isHeaderHidden = false;
            stickyHeader.classList.remove('hide-smooth');
            stickyHeader.classList.add('show-instant');
            scrollAccumulator = 0;
          }
        }

        lastScrollTop = scrollTop;
      }, { passive: true });

      // ============================================
      // HEADER TOGGLE SWITCH (DARK MODE)
      // ============================================
      const headerToggle = document.getElementById('header-toggle');
      const toggleDot = document.querySelector('.toggle-dot');
      const toggleBg = document.querySelector('.toggle-bg');
      const darkModeSun = document.getElementById('dark-mode-sun');
      const darkModeMoon = document.getElementById('dark-mode-moon');
      const DARK_MODE_SESSION_KEY = 'darkModeEnabledV1';
      const THEME_TRANSITION_CLASS = 'theme-transitioning';
      const THEME_TRANSITION_DURATION_MS = 560;

      let themeTransitionTimeout = null;
      let themeTransitionOverlay = null;

      function getOrCreateThemeTransitionOverlay() {
        if (themeTransitionOverlay) return themeTransitionOverlay;

        const existing = document.getElementById('theme-transition-overlay');
        if (existing) {
          themeTransitionOverlay = existing;
          return themeTransitionOverlay;
        }

        themeTransitionOverlay = document.createElement('div');
        themeTransitionOverlay.id = 'theme-transition-overlay';
        document.body.appendChild(themeTransitionOverlay);
        return themeTransitionOverlay;
      }

      function getInitialDarkModePreference() {
        try {
          const stored = sessionStorage.getItem(DARK_MODE_SESSION_KEY);
          if (stored === 'true') return true;
          if (stored === 'false') return false;
        } catch (error) {
          debugWarn('Failed to read dark mode preference from session:', error);
        }

        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      function persistDarkModePreference(isDark) {
        try {
          sessionStorage.setItem(DARK_MODE_SESSION_KEY, String(isDark));
        } catch (error) {
          debugWarn('Failed to persist dark mode preference in session:', error);
        }
      }

      function triggerThemeTransition() {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          return;
        }

        const overlay = getOrCreateThemeTransitionOverlay();
        const toggleRect = headerToggle.getBoundingClientRect();
        const originX = toggleRect.left + (toggleRect.width / 2);
        const originY = toggleRect.top + (toggleRect.height / 2);

        document.documentElement.style.setProperty('--theme-origin-x', `${originX}px`);
        document.documentElement.style.setProperty('--theme-origin-y', `${originY}px`);

        document.documentElement.classList.remove(THEME_TRANSITION_CLASS);
        void document.documentElement.offsetWidth;
        document.documentElement.classList.add(THEME_TRANSITION_CLASS);

        overlay.animate(
          [
            { opacity: 0, transform: 'scale(1.02)', filter: 'blur(0px)' },
            { opacity: 0.44, transform: 'scale(1)', filter: 'blur(0.6px)', offset: 0.45 },
            { opacity: 0, transform: 'scale(0.99)', filter: 'blur(0px)' }
          ],
          {
            duration: THEME_TRANSITION_DURATION_MS,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'none'
          }
        );

        if (themeTransitionTimeout) {
          clearTimeout(themeTransitionTimeout);
        }

        themeTransitionTimeout = setTimeout(() => {
          document.documentElement.classList.remove(THEME_TRANSITION_CLASS);
        }, THEME_TRANSITION_DURATION_MS);
      }

      function applyDarkMode(isDark, persist = true, animate = false) {
        if (animate) {
          triggerThemeTransition();
        }

        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        headerToggle.checked = isDark;
        toggleDot.style.transform = isDark ? 'translateX(24px)' : 'translateX(0)';

        if (toggleBg) {
          toggleBg.classList.toggle('app-dark-toggle-bg-off', !isDark);
          toggleBg.classList.toggle('app-dark-toggle-bg-on', isDark);
        }

        if (darkModeSun) {
          darkModeSun.classList.toggle('app-dark-toggle-icon-active', !isDark);
          darkModeSun.classList.toggle('app-dark-toggle-icon-muted', isDark);
        }

        if (darkModeMoon) {
          darkModeMoon.classList.toggle('app-dark-toggle-icon-active', isDark);
          darkModeMoon.classList.toggle('app-dark-toggle-icon-muted', !isDark);
        }

        if (persist) {
          persistDarkModePreference(isDark);
        }

        debugLog('Dark mode:', isDark);
      }

      applyDarkMode(getInitialDarkModePreference(), true, false);

      function toggleDarkMode() {
        applyDarkMode(headerToggle.checked, true, true);
      }

      // ============================================
      // REFRESH BUTTON
      // ============================================
      function refreshPrerequisites() {
        debugLog('Refresh clicked - resetting prerequisite session cache');

        try {
          sessionStorage.removeItem('prerequisitesChecksCacheV1');
          sessionStorage.removeItem('vpnSetupChecksCacheV1');
          sessionStorage.removeItem('selectedConfig');
          sessionStorage.removeItem(AUTO_NAVIGATED_TO_VPN_KEY);
          sessionStorage.removeItem('prereqMachineCertRemediationContextV1');
          sessionStorage.removeItem('prereqMachineCertRemediationReturnV1');
        } catch (error) {
          debugWarn('Failed to clear one or more session cache keys:', error);
        }

        window.selectedConfig = null;
        setVpnSetupNavEnabled(false);

        RewstDOM.showInfo('Session cache reset. Re-running prerequisites checks...');
        switchPage('prerequisites');
      }

      // ============================================
      // FILTER DRAWER
      // ============================================
      const filterOverlay = document.getElementById('filter-overlay');
      const filterDrawer = document.getElementById('filter-drawer');
      const openFilterDrawerBtn = document.getElementById('open-filter-drawer');

      function openFilterDrawer() {
        filterOverlay.classList.remove('hidden');
        filterOverlay.classList.add('open');
        filterDrawer.classList.add('open');
      }

      function closeFilterDrawer() {
        filterOverlay.classList.remove('open');
        filterDrawer.classList.remove('open');
        setTimeout(() => { filterOverlay.classList.add('hidden'); }, 300);
      }

      // HTMX uses these named handlers from markup for readability.
      window.AppUI = {
        toggleSidebar,
        refreshPrerequisites,
        openFilterDrawer,
        closeFilterDrawer,
        toggleDarkMode
      };

      if (openFilterDrawerBtn) {
        openFilterDrawerBtn.addEventListener('click', openFilterDrawer);
      }

      // ============================================
      // SHARED WORKFLOW STEP HELPERS
      // ============================================
      function getWorkflowStepDefinitions(workflowKey, fallbackSteps = []) {
        const workflowSteps = window.WORKFLOW_STEPS || {};
        const configured = workflowSteps[workflowKey];
        return Array.isArray(configured) && configured.length > 0 ? configured : fallbackSteps;
      }

      function resolveWorkflowStepByTaskCount(workflowKey, numSuccessfulTasks, fallbackSteps = []) {
        const steps = getWorkflowStepDefinitions(workflowKey, fallbackSteps);
        if (!Array.isArray(steps) || steps.length === 0) {
          return { steps: [], index: 0, step: null };
        }

        if (!Number.isFinite(numSuccessfulTasks)) {
          return { steps, index: 0, step: steps[0] };
        }

        const index = steps.findIndex((step) => {
          const minTasks = Number.isFinite(step?.minTasks) ? step.minTasks : 0;
          const maxTasks = Number.isFinite(step?.maxTasks) ? step.maxTasks : Infinity;
          return numSuccessfulTasks >= minTasks && numSuccessfulTasks <= maxTasks;
        });

        if (index >= 0) {
          return { steps, index, step: steps[index] };
        }

        const firstMin = Number.isFinite(steps[0]?.minTasks) ? steps[0].minTasks : 0;
        if (numSuccessfulTasks < firstMin) {
          return { steps, index: 0, step: steps[0] };
        }

        const lastIndex = steps.length - 1;
        return { steps, index: lastIndex, step: steps[lastIndex] };
      }

      // ============================================
      // PAGE RENDER FUNCTIONS
      // ============================================

      {{ PAGE_PREREQUISITES }}

      {{ PAGE_REMEDIATION }}

      {{ PAGE_VPNSETUP }}

      // ============================================
      // BOOT
      // ============================================
      debugLog("App ready - rendering initial page");
      pages[currentPage].render();

    })();
  </script>
